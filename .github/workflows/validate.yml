name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate structure and public hygiene
        run: python3 scripts/validate_repo.py
      - name: Test read-only delivery checks
        run: python3 -m unittest discover -s tests -v
      - name: Check isolated public source tree
        run: python3 scripts/check_public.py
